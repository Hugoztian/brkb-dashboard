<script>
const D=window.BRK_DATA,L=()=>document.documentElement.dataset.lang,T=s=>s;
const lk=(s,u)=>u?`<a href="${u}" target="_blank" rel="noopener">${s}</a>`:s,na=(w)=>`<span class="na">${w||'unavailable'}</span>`;
const S10=()=>lk('10-Q Q2 2026 (filed 10 Aug 2026)',D.src.q10[1]),S13=()=>lk('13F-HR 30 Jun 2026 (filed 14 Aug 2026)',D.src.f13[1]);
const bn=v=>v==null||!isFinite(v)?na():(v<0?'−':'')+'$'+(Math.abs(v)/1000).toFixed(2)+'bn',mn=v=>v==null?na():(v<0?'−':'')+'$'+Math.abs(v).toLocaleString('en-US')+'m',usd=(v,d=2)=>v==null||!isFinite(v)?na():'$'+v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=v=>v==null?'':(v>=0?'pos':'neg');
const TABS=[['overview','Overview'],['bv','Book value'],['portfolio','Portfolio MTM'],['ops','Operations'],['val','Valuation & Street'],['people','Leadership & filings']];
const QUOTE_API=(new URLSearchParams(location.search).get('quoteapi'))||(/\.workers\.dev$/.test(location.hostname)?'/api/quote':'https://brkb-dashboard.cashcache.workers.dev/api/quote');
const CN=s=>'https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?symbols='+s.join('|')+'&requestMethod=itv&noform=1&partnerId=2&fund=1&exthrs=1&output=json&events=1';
const SYMS=['BRK.B','BRK.A',...new Set(D.hold.map(h=>h.tk))];
const Q={brk:null,brka:null,src:null,px:{},jp:{},fx:null,at:0,err:null,werr:null,fail:[]};let EQM=false;try{EQM=localStorage.getItem('brk-eqm')==='1'}catch(e){}
const num=s=>s==null?null:parseFloat(String(s).replace(/,/g,''));
async function q1(sym){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),6000);try{const r=await fetch(QUOTE_API+'?symbol='+encodeURIComponent(sym)+'&t='+Date.now(),{cache:'no-store',signal:ctl.signal});const j=await r.json();if(!j.ok||!j.main||j.main.price==null)throw new Error(j.error||'bad');return j}finally{clearTimeout(to)}}
let WORKER_DOWN=false;
// Path 1: our Worker (Robinhood -> Nasdaq). Path 2 (CORS-open, works on github.io): CNBC quote feed, batched 25 symbols/request.
async function cnbcAll(list,n=12){const out={};for(let i=0;i<list.length;i+=n){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);try{const r=await fetch(CN(list.slice(i,i+n)),{cache:'no-store',signal:ctl.signal});const j=await r.json();for(const q of j.FormattedQuoteResult.FormattedQuote)if(q.last)out[q.symbol]=q}catch(e){}finally{clearTimeout(to)}}return out}
async function poll(){if(document.visibilityState==='hidden')return;Q.fail=[];let got={};
 if(!WORKER_DOWN){const t=await q1('BRK.B').catch(e=>null);if(!t)WORKER_DOWN=true;else{const res=await Promise.allSettled(SYMS.map(q1));res.forEach((r,i)=>{if(r.status==='fulfilled')got[SYMS[i]]=r.value});
  const j=got['BRK.B'],m=j.main;Q.brk={last:m.price,chg:m.change!=null?(m.change>=0?'+':'')+m.change.toFixed(2):null,pct:m.pct!=null?(m.pct>=0?'+':'')+m.pct.toFixed(2)+'%':null,time:(m.label||'')+(m.time_et?' · '+m.time_et:''),reg:j.regular&&j.regular.price,ext:j.ext&&j.ext.price,label:m.label,stale:!!j.stale};Q.src=j.source+' via brkb-dashboard Worker'}}
 const need=[...SYMS.filter(s=>!got[s]),...D.japan.map(j=>j.tk),'JPY='];
 try{const c=await cnbcAll(need);const miss=need.filter(s=>!c[s]);if(miss.length)Object.assign(c,await cnbcAll(miss,1));
  for(const s of need){const q=c[s],v=q&&num(q.last);if(!v){if(s!=='JPY=')Q.fail.push(s);continue}
   if(s==='BRK.B'){const x=q.ExtendedMktQuote,xv=x&&num(x.last),open=q.curmktstatus==='REG_MKT';Q.brk={last:v,chg:q.change,pct:q.change_pct,reg:v,ext:xv,extLabel:x&&x.type==='POST_MKT'?'After-hours':x&&x.type==='PRE_MKT'?'Pre-market':null,extChg:x&&x.change_pct,
     time:(open?'Live · ':'Close · ')+q.last_timedate+(q.realTime==='true'?' (real-time)':' (may be delayed)'),label:open?'Live':'Last close',stale:!open};Q.src='CNBC quote feed (public, CORS-open)'}
   else if(s==='BRK.A')Q.brka=v;else if(s==='JPY=')Q.fx=v;else if(/\.T$/.test(s))Q.jp[s]=v;else Q.px[s]=v}
  for(const[s,j]of Object.entries(got))if(s!=='BRK.B'){if(s==='BRK.A')Q.brka=j.main.price;else Q.px[s]=j.main.price}
  Q.err=null}catch(e){Q.err=String(e);need.forEach(s=>Q.fail.push(s))}
 Q.werr=WORKER_DOWN?'own Worker not deployed yet → CNBC fallback':null;Q.at=Date.now();render()}
function calc(){return BRKCalc.liveBV(D,Q.px,{eqmAtMarket:EQM})}
function kpiJSON(){const r=calc(),p=Q.brk&&Q.brk.last;return {asof_sgt:new Date(Q.at||Date.now()).toLocaleString('en-SG',{timeZone:'Asia/Singapore'}),brkb_price:p,bv_per_b_live:+r.bvB.toFixed(2),bv_per_b_qe:+r.bvBqe.toFixed(2),pb_live:p?+(p/r.bvB).toFixed(3):null,pb_qe:p?+(p/r.bvBqe).toFixed(3):null,mtm_delta_pre_tax_m:Math.round(r.delta),eqm_at_market:EQM,tax_rate:0.21,buybacks_since_qe_m:0,b_equiv_shares:r.bShares,missing_prices:r.missing,source:'10-Q Q2 2026 + 13F 30 Jun 2026; prices '+(Q.src||'none')}}
function headline(){const r=calc(),p=Q.brk&&Q.brk.last;return `<div class="h4">
<div class="hcard"><div class="l"><i class="livedot"></i> Real-time book value / B share</div><div class="v">${usd(r.bvB)}</div><div class="ch ${sgn(r.bvB-r.bvBqe)}">${((r.bvB/r.bvBqe-1)*100).toFixed(2)}% vs quarter-end</div><div class="s">Quarter-end (30 Jun 2026): ${usd(r.bvBqe)}</div><div class="asof">Estimate: 10-Q equity + after-tax (21%) MTM delta of 13F holdings since 30 Jun${EQM?' incl. OXY/KHC at market':''} · ${S10()} · ${S13()} · prices: ${Q.src||'loading'}</div></div>
<div class="hcard"><div class="l"><i class="livedot"></i> BRK.B live price</div><div class="v">${p?usd(p):(Q.at?na('price feed unreachable'):'<span class="na">loading…</span>')}</div><div class="ch ${Q.brk&&String(Q.brk.chg).startsWith('-')?'neg':'pos'}">${Q.brk&&Q.brk.chg!=null?Q.brk.chg+' ('+Q.brk.pct+')':''}</div><div class="s">${Q.brk?Q.brk.time||'':''}${Q.brk&&Q.brk.ext&&Q.brk.extLabel?` · ${Q.brk.extLabel} ${usd(Q.brk.ext)} (${Q.brk.extChg})`:''}${Q.brk&&Q.brk.stale?' · <b>market closed: showing last close</b>':''}</div><div class="asof">Source: ${Q.src||'—'}${Q.werr?' ('+Q.werr+')':''}${Q.brka?' · BRK.A '+usd(Q.brka,0):''} · updated ${Q.at?new Date(Q.at).toLocaleTimeString('en-SG',{timeZone:'Asia/Singapore'})+' SGT':'—'} · refreshes every 30 s</div></div>
<div class="hcard"><div class="l">Live P/B</div><div class="v">${p?(p/r.bvB).toFixed(2)+'<small>×</small>':na()}</div><div class="s">At quarter-end BV: ${p?(p/r.bvBqe).toFixed(2)+'×':'—'}</div><div class="asof">P/B = live BRK.B ÷ BV per B share (live estimate / 10-Q)</div></div>
<div class="hcard"><div class="l">Market cap (B-equivalent)</div><div class="v">${p?'$'+(p*r.bShares/1e12).toFixed(3)+'<small>tn</small>':na()}</div><div class="s">${(r.bShares/1e9).toFixed(4)}bn B-equiv. shares (1,431,693 A-eq × 1,500)</div><div class="asof">Shares: ${S10()} Note 18</div></div></div>
<div class="card" style="padding:12px 20px"><label style="cursor:pointer"><input type="checkbox" ${EQM?'checked':''} onchange="EQM=this.checked;try{localStorage.setItem('brk-eqm',EQM?'1':'0')}catch(e){};render()"> Mark equity-method stakes (OXY, KHC) to market in BV</label> <span class="src">· Off = GAAP view (equity-method carrying values unchanged). OXY Q-end carrying $10.73bn vs fair value $12.87bn; KHC carrying $8.76bn vs fair value $7.69bn (${S10()} Note 5). Buybacks since 30 Jun: $0 assumed (not yet disclosed).</span>
<button onclick="navigator.clipboard.writeText(JSON.stringify(kpiJSON(),null,2));this.textContent='Copied ✓'" style="float:right;border:0;border-radius:980px;padding:4px 12px;background:var(--accsoft);color:var(--acc);cursor:pointer">Copy KPI JSON</button></div>`}
function alerts(){const r=calc(),p=Q.brk&&Q.brk.last,A=[];
 if(p){const pb=p/r.bvB;A.push([pb>1.6?'⚠':'ℹ',`Live P/B ${pb.toFixed(2)}× (quarter-end BV ${(p/r.bvBqe).toFixed(2)}×).`])}
 A.push(['⚠','Kraft Heinz carrying value exceeds fair value by $1.1bn (12.2%) at 30 Jun 2026; Berkshire says an impairment may be recognised later (10-Q Note 5).']);
 const d=Math.ceil((new Date(D.next.date+'T08:00:00+08:00')-new Date())/864e5);A.push(['📅',`Q3 2026 results expected ~${D.next.date} (${d} days; unconfirmed date, ${lk('source',D.next.url)}). Q3 10-Q will disclose buybacks since 30 Jun.`]);
 A.push(['ℹ',`Cash + T-bills ≈ $364.7bn vs $30bn buyback floor (${S10()}).`]);
 if(r.missing.length)A.push(['ℹ',`${r.missing.length} smaller 13F positions lack a live price and are held at 30 Jun values: ${r.missing.join(', ')}.`]);
 return `<div class="card"><h2>Alerts</h2><ul class="lst">${A.map(a=>`<li>${a[0]} ${a[1]}</li>`).join('')}</ul></div>`}
function BV(){const b=D.bs,r=calc();const g=k=>b.assets.filter(a=>a[2]===k).reduce((s,a)=>s+a[1],0),gl=k=>b.liabs.filter(a=>a[2]===k).reduce((s,a)=>s+a[1],0);
 const tx=Math.round(D.eq_basis.unreal*0.21);
 return `<h1>Book value bridge</h1><p class="sub">Consolidated balance sheet at 30 Jun 2026, US$ millions. Source: ${S10()} (balance sheet p.2–3; Notes 4, 5, 18). Totals reconcile to the filing (assets $1,263,071m; liabilities $512,894m).</p>
<div class="card" style="overflow-x:auto"><table><tr><th>Item</th><th class="n">30 Jun 2026</th></tr>
${b.assets.map(a=>`<tr><td>${a[0]}</td><td class="n">${mn(a[1])}</td></tr>`).join('')}<tr><td><b>Total assets</b></td><td class="n"><b>${mn(b.total_assets)}</b></td></tr>
${b.liabs.map(a=>`<tr><td>less: ${a[0]}</td><td class="n neg">(${mn(a[1])})</td></tr>`).join('')}
<tr><td>less: Noncontrolling (minority) interests</td><td class="n neg">(${mn(b.nci)})</td></tr>
<tr><td><b>Berkshire shareholders’ equity</b></td><td class="n"><b>${mn(b.equity)}</b></td></tr>
<tr><td><b>Book value per Class B share</b> (÷ ${r.bShares.toLocaleString()} B-equiv.)</td><td class="n"><b>${usd(r.bvBqe)}</b></td></tr><tr><td>Book value per Class A share</td><td class="n">${usd(b.equity*1e6/D.shares.a_eq,0)}</td></tr></table></div>
<div class="grid"><div class="kpi"><div class="k">Cash & T-bills (total)</div><div class="v">${bn(g('cash'))}</div><div class="src">10-Q; incl. $3.2bn T-bills in cash eq.</div></div><div class="kpi"><div class="k">Insurance liabilities</div><div class="v">${bn(gl('ins'))}</div><div class="src">10-Q</div></div><div class="kpi"><div class="k">Insurance float</div><div class="v">≈$177.5bn</div><div class="src">10-Q MD&A</div></div><div class="kpi"><div class="k">Total debt</div><div class="v">${bn(gl('debt'))}</div><div class="src">I&O $43.3bn + RUE $85.3bn</div></div><div class="kpi"><div class="k">Income taxes, principally deferred</div><div class="v">${bn(gl('tax'))}</div><div class="src">10-Q (total, all sources)</div></div><div class="kpi"><div class="k">Deferred tax on equity gains (est.)</div><div class="v">${bn(tx)}</div><div class="src">Estimate: 21% × $217.3bn unrealised gains (Note 4); not a filed figure</div></div></div>
<div class="card"><h2>Equity-method stakes (Note 5)</h2><table><tr><th>Investee</th><th class="n">Own %</th><th class="n">Carrying</th><th class="n">Fair value</th><th class="n">FV − carrying</th></tr>${D.eqm.map(e=>`<tr><td>${e.name}</td><td class="n">${e.pct}%</td><td class="n">${mn(e.carry)}</td><td class="n">${e.fv?mn(e.fv):'unlisted'}</td><td class="n ${sgn(e.fv-e.carry)}">${e.fv?mn(e.fv-e.carry):'carried at book'}</td></tr>`).join('')}</table><p class="src">${S10()} Note 5, 30 Jun 2026.</p></div>
<div class="card"><h2>Method: real-time BV per B share</h2><ol class="lst"><li>Start: Berkshire shareholders’ equity $747,910m (10-Q, 30 Jun 2026).</li><li>Add (live price × 13F shares − 30 Jun 13F value) for each fair-value 13F holding with a live price. 13F 30 Jun values equal fair value at quarter-end.</li><li>Optional toggle: add (live market value − carrying value) for OXY and KHC (equity-method).</li><li>Multiply the delta by (1 − 21%) for deferred tax (federal rate; state taxes ignored — assumption).</li><li>Subtract buybacks since quarter-end (currently $0: not yet disclosed).</li><li>Divide by Class-B-equivalent shares = 1,431,693 A-equivalent × 1,500 = 2,147,539,500 (30 Jun 2026; Class A × 1,500 + Class B).</li></ol>
<p class="src">Not captured: Japanese trading houses and other non-13F equities (no per-name quarter-end carrying values filed), fixed income, FX on yen debt, operating earnings accrued since 30 Jun, and dividends. The calculator lives in <code>calc.js</code> (<code>BRKCalc.liveBV(D, prices, {eqmAtMarket})</code>) and runs in Node for KPI reports; the “Copy KPI JSON” button exports the current snapshot.</p></div>`}
function PORT(){const r=calc();const rows=r.rows;return `<h1>Portfolio mark-to-market</h1><p class="sub">13F holdings at 30 Jun 2026 (${S13()}) × live prices: brkb-dashboard Worker when deployed, otherwise the public CNBC quote feed (regular-session last / close). Values US$ millions.</p>
<div class="grid"><div class="kpi"><div class="k">13F MTM (priced names)</div><div class="v">${bn(r.mtm13F)}</div><div class="src">vs ${bn(r.qe13F)} at 30 Jun</div></div><div class="kpi"><div class="k">Change since quarter end</div><div class="v ${sgn(r.mtm13F-r.qe13F)}">${bn(r.mtm13F-r.qe13F)}</div><div class="src">${((r.mtm13F/r.qe13F-1)*100).toFixed(1)}%</div></div><div class="kpi"><div class="k">Unrealised gain (equity securities, est.)</div><div class="v">${bn(r.unrealLive)}</div><div class="src">$217.3bn at 30 Jun (Note 4) + FV delta</div></div><div class="kpi"><div class="k">Deferred tax on it (est.)</div><div class="v">${bn(r.deferredTaxEst)}</div><div class="src">Method: 21% federal rate × unrealised gain; ignores state tax and basis detail</div></div></div>
<div class="card" style="overflow-x:auto;margin-top:20px"><table><tr><th>Holding</th><th>Ticker</th><th class="n">Shares</th><th class="n">30 Jun value</th><th class="n">Live price</th><th class="n">Live value</th><th class="n">Δ vs 30 Jun / carrying</th><th>In BV?</th></tr>
${rows.map(h=>`<tr><td>${h.name}${h.eqm?' <span class="est">equity method</span>':''}${['AAPL','AXP','BAC','KO','CVX','OXY'].includes(h.tk)?' <b>★</b>':''}</td><td>${h.tk}</td><td class="n">${h.sh.toLocaleString()}</td><td class="n">${mn(Math.round(h.qv))}</td><td class="n">${h.px?usd(h.px):na()}</td><td class="n">${h.lv!=null?mn(Math.round(h.lv)):na()}</td><td class="n ${sgn(h.d)}">${h.d!=null?mn(Math.round(h.d)):na()}${h.eqm?' <span class="src">vs carrying '+mn(h.carry)+'</span>':''}</td><td>${h.inBV?'yes':'no'}</td></tr>`).join('')}</table><p class="src">13F value aggregates all Berkshire managers. OXY and KHC are equity-method on the balance sheet, so their delta is measured against carrying value and only enters BV when the toggle is on.</p></div>
<div class="card"><h2>Japanese trading houses (outside 13F)</h2><table><tr><th>Company</th><th class="n">Shares</th><th>Stake as of</th><th class="n">Live ¥</th><th class="n">Live US$</th></tr>${D.japan.map(j=>{const p=Q.jp[j.tk],v=p&&Q.fx?j.sh*p/Q.fx/1e6:null;return `<tr><td>${j.name}</td><td class="n">${j.sh.toLocaleString()}</td><td>${j.asof} · ${j.url?lk(j.via,j.url):lk('EDINET via tracker',D.japan_via[1])}</td><td class="n">${p?'¥'+p.toLocaleString():na()}</td><td class="n">${v?mn(Math.round(v)):na()}</td></tr>`}).join('')}</table><p class="src">Share counts: Berkshire (National Indemnity) Japanese large-shareholding reports, compiled by ${lk('berkshirerealtimevalue.com',D.japan_via[1])} (third party) and Itochu’s ${lk('2 Mar 2026 release','https://www.itochu.co.jp/en/news/press/2026/260302.html')}. Reports are only filed at ~1% changes, so counts are floors. Berkshire’s 10-Q does not give per-name values; these are excluded from the live BV delta. Tokyo prices (JPY, last Tokyo close) and USD/JPY come from the CNBC quote feed.</p></div>`}
function OPS(){const s=D.seg,sum=i=>s.rows.reduce((a,r)=>a+r[i],0);const b=D.buyback;const tot=b.q2.reduce((a,r)=>a+r[2]*r[3],0);
 return `<h1>Operations</h1><p class="sub">After-tax earnings attributable to Berkshire shareholders, US$ millions, from management’s own disaggregation in ${S10()} (MD&A). Operating and investment results are shown separately.</p>
<div class="card" style="overflow-x:auto"><table><tr><th>Operating earnings</th>${s.cols.map(c=>`<th class="n">${c}</th>`).join('')}</tr>${s.rows.map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(v=>`<td class="n">${mn(v)}</td>`).join('')}</tr>`).join('')}<tr><td><b>Total operating earnings</b></td>${[1,2,3,4].map(i=>`<td class="n"><b>${mn(sum(i))}</b></td>`).join('')}</tr></table>
<h2 style="margin-top:20px">Investment results (separate)</h2><table><tr><th></th>${s.cols.map(c=>`<th class="n">${c}</th>`).join('')}</tr>${s.inv.map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(v=>`<td class="n ${sgn(v)}">${mn(v)}</td>`).join('')}</tr>`).join('')}<tr><td><b>Net earnings attributable to Berkshire</b></td>${s.net.map(v=>`<td class="n"><b>${mn(v)}</b></td>`).join('')}</tr></table><p class="src">Derivative gains/losses are included in “Investment gains (losses)” (Berkshire does not break them out in the 10-Q earnings table). “Other” includes FX gains/losses on non-USD Berkshire/BHFC debt (+$1.2bn y/y in Q2 per 10-Q).</p></div>
<div class="grid"><div class="kpi"><div class="k">Insurance float</div><div class="v">≈$177.5bn</div><div class="src">30 Jun 2026; +$1.1bn YTD (10-Q)</div></div><div class="kpi"><div class="k">Cash & equivalents (I&O + RUE)</div><div class="v">$40.61bn</div><div class="src">$35,096m + $5,513m (10-Q)</div></div><div class="kpi"><div class="k">Short-term T-bills</div><div class="v">$324.91bn</div><div class="src">10-Q, 30 Jun 2026</div></div><div class="kpi"><div class="k">Insurance cash + T-bills</div><div class="v">$210.31bn</div><div class="src">Insurance invested assets (10-Q)</div></div></div>
<div class="card" style="margin-top:20px"><h2>Buybacks</h2><table><tr><th>Month (2026)</th><th>Class</th><th class="n">Shares</th><th class="n">Avg price</th><th class="n">Amount</th></tr><tr><td>April</td><td colspan="4">none</td></tr>${b.q2.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="n">${r[2].toLocaleString()}</td><td class="n">${usd(r[3])}</td><td class="n">${mn(Math.round(r[2]*r[3]/1e6))}</td></tr>`).join('')}<tr><td><b>Q2 2026 total</b></td><td colspan="3"></td><td class="n"><b>${bn(tot/1e6)}</b></td></tr></table><p class="src">${S10()} Part II Item 2. ${b.note} ${D.cashpol}</p></div>`}
function VAL(){const r=calc(),p=Q.brk&&Q.brk.last,st=D.street,sp=p?BRKCalc.sotp(D,r,p):null;return `<h1>Valuation & Street</h1>
<div class="card"><h2>Sum of the parts (market-implied)</h2>${sp?`<table><tr><td>Market cap (live BRK.B × 2.1475bn B-equiv.)</td><td class="n">${bn(sp.mcap)}</td></tr><tr><td>less: Listed equity portfolio, live (fair-value equities $323.8bn at 30 Jun + live 13F delta)</td><td class="n">(${bn(sp.eqLive)})</td></tr><tr><td>less: OXY + KHC at market (Berkadia at carrying)</td><td class="n">(${bn(sp.eqmMkt)})</td></tr><tr><td>add back: est. deferred tax on unrealised equity gains (21%)</td><td class="n">${bn(r.deferredTaxEst)}</td></tr><tr><td>less: Cash & T-bills net of unsettled T-bill payable</td><td class="n">(${bn(sp.cash)})</td></tr><tr><td>less: Fixed maturities</td><td class="n">(${bn(sp.fix)})</td></tr><tr><td>add: Insurance & Other debt (parent + BHFC + subs)</td><td class="n">${bn(sp.ioDebt)}</td></tr><tr><td><b>= Implied value of operating businesses</b> (insurance ops, BNSF, BHE, MSR)</td><td class="n"><b>${bn(sp.ops)}</b></td></tr></table>`:na('waiting for live price')}
<p class="src">Assumptions: BNSF/BHE debt ($85.3bn) stays with the operating businesses; float ($177.5bn) is treated as a funding source and not deducted (Berkshire’s view) — deducting insurance liabilities instead would raise the implied operating value; deferred tax at 21% on equity gains only; Japan stakes are inside the $323.8bn at 30 Jun values. Inputs: ${S10()}, ${S13()}. This is a framework, not a fair-value estimate.</p></div>
<div class="card"><h2>Wall Street (third-party estimates — not management numbers)</h2><div class="grid"><div class="kpi"><div class="k">Consensus rating</div><div class="v">${st.rating}</div><div class="src">${st.n} analysts</div></div><div class="kpi"><div class="k">Avg price target</div><div class="v">$${st.avg}</div><div class="src">${p?((st.avg/p-1)*100).toFixed(1)+'% vs live':''}</div></div><div class="kpi"><div class="k">Range</div><div class="v">$${st.lo}–$${st.hi}</div></div></div><p class="src">As of ${st.asof} · ${lk(st.via[0],st.via[1])}. Coverage is thin; aggregators disagree.</p><ul class="lst">${st.notes.map(n=>`<li>${n[0]} · ${lk(n[1],n[2])}</li>`).join('')}<li>${lk(st.q3,st.q3url)}</li></ul></div>`}
function PEOPLE(){return `<h1>Leadership & filings</h1><div class="card"><h2>Leadership</h2><table>${D.people.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]}</td></tr>`).join('')}</table><p class="src">Abel succeeded Warren Buffett as CEO on 1 Jan 2026; Buffett remains chairman. Source: ${lk(D.people_src[0],D.people_src[1])}.</p></div>
<div class="card"><h2>Recent news</h2><ul class="week">${D.news.map(n=>`<li><span class="d">${n[0]}</span>${lk(n[1],n[2])}</li>`).join('')}</ul></div>
<div class="card" style="overflow-x:auto"><h2>Recent SEC filings</h2><table><tr><th>Filed</th><th>Form</th><th>Period</th></tr>${D.filings.map(f=>`<tr><td>${f[0]}</td><td>${lk(f[1],f[3])}</td><td>${f[2]||''}</td></tr>`).join('')}</table><p class="src">${lk(D.src.edgar[0],D.src.edgar[1])} · captured ${D.built_sgt} SGT.</p></div>`}
function render(){let tab=location.hash.slice(1)||'overview';document.getElementById('nav').innerHTML=TABS.map(([k,n])=>`<a href="#${k}" class="${k===tab?'on':''}">${n}</a>`).join('');
 const S={overview:`<div class="hero"><h1>Berkshire Hathaway <span class="tk">$BRK.B</span> Dashboard</h1><div class="src">Built ${D.built_sgt} SGT · latest filings: 10-Q Q2 2026, 13F 30 Jun 2026 · © 2026 Hugo Tian</div></div>${headline()}${alerts()}
 <div class="h2row"><div class="mini"><div class="l">Q2 2026 operating earnings</div><div class="v">$12.98bn</div><div class="s">10-Q, after tax</div></div><div class="mini"><div class="l">Cash & T-bills</div><div class="v">$364.7bn</div><div class="s">net of unsettled payable · 10-Q</div></div><div class="mini"><div class="l">Float</div><div class="v">≈$177.5bn</div><div class="s">10-Q</div></div><div class="mini"><div class="l">Q2 2026 buybacks</div><div class="v">$4.53bn</div><div class="s">10-Q Part II Item 2</div></div></div>`,bv:headline()+BV(),portfolio:PORT(),ops:OPS(),val:headline()+VAL(),people:PEOPLE()};
 document.getElementById('main').innerHTML=S[tab]||S.overview;document.getElementById('foot').innerHTML='Data: SEC EDGAR filings (management numbers) unless labelled; live US prices via the brkb-dashboard Worker (Robinhood/Nasdaq); Tokyo via CNBC. Not investment advice. © 2026 Hugo Tian'}
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
function applyTheme(){const t=document.documentElement.dataset.theme||'auto';document.getElementById('themelbl').textContent=t==='auto'?'Auto':t==='dark'?'Dark':'Light';document.getElementById('themeic').textContent=t==='auto'?'◐':t==='dark'?'☾':'☀'}
document.getElementById('themebtn').onclick=()=>{const h=document.documentElement,cur=h.dataset.theme||'auto',nx=cur==='auto'?(isDark()?'light':'dark'):cur==='dark'?'light':'auto';if(nx==='auto'){delete h.dataset.theme;try{localStorage.removeItem('brk-theme')}catch(e){}}else{h.dataset.theme=nx;try{localStorage.setItem('brk-theme',nx)}catch(e){}}applyTheme()};
window.addEventListener('hashchange',render);applyTheme();render();poll();setInterval(poll,30000);
</script></body></html>
